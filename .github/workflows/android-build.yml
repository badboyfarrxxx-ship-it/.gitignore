name: Build Android APK

on:
  push:
    branches:
      - claude/virus-malware-scanner-app-1q7vnu
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-scan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_id }}
          name: "Sentinel Scan APK (build ${{ github.run_number }})"
          body: "Automated debug APK build from commit ${{ github.sha }}."
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
